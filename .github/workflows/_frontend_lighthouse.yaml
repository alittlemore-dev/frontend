name: Lighthouse

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Run Lighthouse CI
        run: make lighthouse

      - name: Report failed Lighthouse assertions
        if: ${{ failure() && hashFiles('.lighthouseci/assertion-results.json') != '' }}
        run: |
          jq -r '
            .[]
            | select(.level == "error" and .passed == false)
            | "::error title=Lighthouse \(.auditId)::\(.url): expected \(.operator) \(.expected), actual \(.actual)"
          ' .lighthouseci/assertion-results.json

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() && hashFiles('performance/reports/lighthouse/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports-${{ github.sha }}
          path: performance/reports/lighthouse/
          retention-days: 14
