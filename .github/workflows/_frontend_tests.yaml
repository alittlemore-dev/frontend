name: Tests and coverage

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make tests-coverage

      - name: Generate coverage badge
        run: |
          python -m pip install genbadge==1.1.3 defusedxml==0.7.1
          genbadge coverage --local -n frontend -i coverage/cobertura-coverage.xml -o .github/badges/coverage-frontend.svg

      - name: Upload coverage badge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-badge-${{ github.sha }}
          path: .github/badges/coverage-frontend.svg
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-${{ github.sha }}
          path: coverage/
          retention-days: 14
