name: Publish image

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish-image:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      LOCAL_IMAGE: frontend-ci:${{ github.sha }}
    steps:
      - name: Download checked image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-image-${{ github.sha }}
          path: .

      - name: Load checked image
        run: docker load --input frontend-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the checked image
        run: |
          docker tag "${LOCAL_IMAGE}" "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"
