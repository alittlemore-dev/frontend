<section class="card dashboard-foldable-section">
  <h3 class="card-header h5 p-0 mb-0">
    <button
      type="button"
      class="dashboard-foldable-section-toggle btn w-100 d-flex align-items-center gap-3 text-start p-3"
      [attr.data-testid]="'dashboard-section-toggle-' + sectionKey()"
      [attr.aria-expanded]="expanded()"
      [attr.aria-controls]="bodyId()"
      (click)="toggle()"
    >
      <span class="flex-grow-1 min-w-0">
        <span class="d-block fw-semibold">{{ title() }}</span>
        <span class="d-block small fw-normal text-body-secondary mt-1">{{ summary() }}</span>
      </span>
      <svg
        class="dashboard-foldable-section-chevron"
        data-testid="dashboard-section-chevron"
        [class.dashboard-foldable-section-chevron-expanded]="expanded()"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m9 18 6-6-6-6"></path>
      </svg>
    </button>
  </h3>
  <div
    class="card-body"
    [id]="bodyId()"
    [attr.data-testid]="'dashboard-section-body-' + sectionKey()"
    [hidden]="!expanded()"
  >
    <ng-content />
  </div>
</section>
