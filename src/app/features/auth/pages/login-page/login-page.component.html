<dialog
  dsModalDialog
  [dismissible]="!authModal.loginRequired()"
  (dismissed)="close()"
  id="login-modal"
  aria-modal="true"
  aria-labelledby="login-title"
  class="modal login-modal-backdrop"
  [dsModalScroll]="loginScrollArea"
>
  <form
    class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"
    [formGroup]="form"
    (ngSubmit)="login()"
    novalidate
  >
    <div class="modal-content login-modal-content">
      <div class="modal-header">
        <h5 id="login-title" class="modal-title">{{ 'auth.login.title' | t }}</h5>
        @if (!authModal.loginRequired()) {
          <button
            type="button"
            class="btn-close"
            [attr.aria-label]="'shared.close' | t"
            (click)="close()"
          ></button>
        }
      </div>

      <div #loginScrollArea class="modal-body">
        @if (authModal.loginRequired()) {
          <p role="status">{{ 'auth.login.sessionExpired' | t }}</p>
        }
        @if (loginError()) {
          <div class="alert alert-danger" role="alert" aria-live="polite">
            {{ loginError() }}
          </div>
        }

        <div class="mb-3">
          <label for="username" class="form-label"
            >{{ 'auth.login.username' | t }}
            <span class="required-marker text-danger" aria-hidden="true">*</span></label
          >
          <input
            id="username"
            required
            type="text"
            class="form-control"
            formControlName="username"
            autocomplete="username"
            [attr.aria-label]="'auth.login.username' | t"
          />
        </div>

        <div class="mb-4">
          <label for="password" class="form-label"
            >{{ 'auth.login.password' | t }}
            <span class="required-marker text-danger" aria-hidden="true">*</span></label
          >
          <input
            id="password"
            required
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [attr.aria-label]="'auth.login.password' | t"
          />
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="submit"
          class="btn button-active"
          [disabled]="form.invalid || submitting()"
          [attr.aria-label]="'auth.login.submit' | t"
        >
          @if (submitting()) {
            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
            {{ 'auth.login.submitting' | t }}
          } @else {
            {{ 'auth.login.submit' | t }}
          }
        </button>
      </div>
    </div>
  </form>
</dialog>
