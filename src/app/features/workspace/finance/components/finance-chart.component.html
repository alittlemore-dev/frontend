<figure class="finance-chart">
  <figcaption class="h6">{{ title() }} · {{ symbol() }}</figcaption>
  @if (!nonzero()) {
    <p class="text-body-secondary">{{ 'finance.statistics.empty' | t }}</p>
  }
  <svg
    [attr.viewBox]="'0 0 720 ' + height()"
    role="group"
    [attr.aria-label]="title() + ' · ' + symbol()"
    preserveAspectRatio="xMidYMid meet"
  >
    @if (kind() === 'pie') {
      @for (slice of slices(); track slice.id) {
        <path
          cdkOverlayOrigin
          #origin="cdkOverlayOrigin"
          class="finance-chart-mark"
          [class.active]="tooltip()?.datum?.id === slice.id"
          [attr.d]="slice.path"
          [attr.fill]="slice.fill"
          role="img"
          tabindex="0"
          [attr.aria-label]="
            slice.label + ': ' + money(slice.amount) + ' · ' + percentage(slice.percentage)
          "
          [attr.aria-describedby]="tooltip()?.datum?.id === slice.id ? tooltipId : null"
          (pointerenter)="showTooltip(slice, origin, 'pointer', slice.percentage)"
          (pointerleave)="scheduleHide()"
          (focus)="showTooltip(slice, origin, 'focus', slice.percentage)"
          (blur)="blurTooltip()"
          (keydown.escape)="hideTooltip()"
        />
      }
    } @else if (kind() === 'horizontal') {
      @for (bar of bars(); track bar.id) {
        <g
          cdkOverlayOrigin
          #origin="cdkOverlayOrigin"
          class="finance-chart-mark"
          [class.active]="tooltip()?.datum?.id === bar.id"
          role="img"
          tabindex="0"
          [attr.aria-label]="bar.label + ': ' + money(bar.amount)"
          [attr.aria-describedby]="tooltip()?.datum?.id === bar.id ? tooltipId : null"
          (pointerenter)="showTooltip(bar, origin, 'pointer')"
          (pointerleave)="scheduleHide()"
          (focus)="showTooltip(bar, origin, 'focus')"
          (blur)="blurTooltip()"
          (keydown.escape)="hideTooltip()"
        >
          <text x="5" [attr.y]="bar.rowY + 17">{{ bar.shortLabel }}</text>
          <rect
            class="finance-bar"
            x="280"
            [attr.y]="bar.rowY"
            [attr.width]="bar.horizontalWidth"
            height="24"
          />
        </g>
      }
    } @else {
      <line x1="35" x2="705" [attr.y1]="zeroY()" [attr.y2]="zeroY()" />
      @for (bar of bars(); track bar.id) {
        <rect
          cdkOverlayOrigin
          #origin="cdkOverlayOrigin"
          class="finance-bar finance-chart-mark"
          [class.active]="tooltip()?.datum?.id === bar.id"
          [attr.x]="bar.x"
          [attr.y]="bar.y"
          [attr.width]="bar.width"
          [attr.height]="bar.height"
          role="img"
          tabindex="0"
          [attr.aria-label]="bar.label + ': ' + money(bar.amount)"
          [attr.aria-describedby]="tooltip()?.datum?.id === bar.id ? tooltipId : null"
          (pointerenter)="showTooltip(bar, origin, 'pointer')"
          (pointerleave)="scheduleHide()"
          (focus)="showTooltip(bar, origin, 'focus')"
          (blur)="blurTooltip()"
          (keydown.escape)="hideTooltip()"
        />
        @if (bar.showLabel) {
          <text [attr.x]="bar.labelX" y="250" text-anchor="middle">{{ bar.label }}</text>
        }
      }
    }
  </svg>
  <div class="finance-chart-table">
    <table class="table table-sm mb-0">
      <caption class="visually-hidden">
        {{
          title()
        }}
      </caption>
      <tbody>
        @for (row of legendRows(); track row.id) {
          <tr>
            <th scope="row">
              @if (kind() === 'pie' && row.fill) {
                <svg class="finance-swatch" viewBox="0 0 1 1" aria-hidden="true">
                  <rect width="1" height="1" [attr.fill]="row.fill" />
                </svg>
              }
              {{ row.label }}
            </th>
            <td class="text-end">{{ money(row.amount) }}</td>
            @if (kind() === 'pie') {
              <td class="text-end">{{ percentage(row.percentage) }}</td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</figure>
@if (tooltip(); as tip) {
  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="tip.origin"
    [cdkConnectedOverlayOpen]="true"
    [cdkConnectedOverlayPositions]="tooltipPositions"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayViewportMargin]="12"
    (overlayOutsideClick)="hideTooltip()"
    (overlayKeydown)="$event.key === 'Escape' && hideTooltip()"
  >
    <div
      class="finance-chart-tooltip"
      role="tooltip"
      [id]="tooltipId"
      (pointerenter)="retainTooltip()"
      (pointerleave)="scheduleHide()"
    >
      <span class="finance-chart-tooltip-label">{{ tip.datum.label }}</span>
      <span class="finance-chart-tooltip-value">{{ money(tip.datum.amount) }}</span>
      @if (tip.percentage !== undefined) {
        <span class="finance-chart-tooltip-percentage">{{ percentage(tip.percentage) }}</span>
      }
    </div>
  </ng-template>
}
