<div class="finance-statistics-filters">
  <div>
    <label for="finance-statistics-period">{{ 'finance.statistics.period' | t }}</label>
    <ds-site-select
      controlSize="small"
      appearance="default"
      inputId="finance-statistics-period"
      [options]="periodOptions()"
      [value]="period()"
      [required]="true"
      [invalid]="false"
      [controlDisabled]="false"
      (valueChange)="periodChange.emit($event)"
    />
  </div>
  <div>
    <label for="finance-statistics-currency">{{ 'finance.statistics.currency' | t }}</label>
    <ds-site-select
      controlSize="small"
      appearance="default"
      inputId="finance-statistics-currency"
      [options]="currencyOptions()"
      [value]="currency()"
      [required]="true"
      [invalid]="false"
      [controlDisabled]="false"
      (valueChange)="currencyChange.emit($event)"
    />
  </div>
</div>
