<app-finance-operation-list
  [headingKey]="kind() === 'expense' ? 'finance.expenses' : 'finance.income'"
  [total]="
    money(kind() === 'expense' ? month().actualExpense : month().actualIncome, month().currency)
  "
  [canAdd]="!readOnly()"
  [saving]="saving()"
  [rows]="rows()"
  [repeatDisabled]="repeatDisabled()"
  [historyTransactionId]="historyTransactionId()"
  [revisions]="historyRows()"
  [revisionsLoading]="revisionsLoading()"
  [revisionsErrorKey]="revisionsErrorKey()"
  (creationRequested)="creationRequested.emit()"
  (editRequested)="editRequested.emit($event)"
  (deletionRequested)="deletionRequested.emit($event)"
  (historyRequested)="historyRequested.emit($event)"
  (historyClosed)="historyClosed.emit()"
  (repetitionRequested)="repetitionRequested.emit($event)"
/>
