<main class="workspace-main container-fluid py-4">
  <div class="d-flex align-items-center gap-2 mb-3 d-lg-none">
    <button
      type="button"
      class="btn btn-outline-secondary workspace-icon-toggle"
      data-testid="workspace-side-panel-toggle"
      [attr.aria-label]="sidePanelToggleLabel()"
      [attr.aria-expanded]="sidePanelOpen()"
      [title]="sidePanelToggleLabel()"
      (click)="toggleSidePanel()"
    >
      @if (sidePanelOpen()) {
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m15 18-6-6 6-6"></path>
          <path d="M20 4v16"></path>
        </svg>
      } @else {
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m9 18 6-6-6-6"></path>
          <path d="M4 4v16"></path>
        </svg>
      }
    </button>
    <h1 class="h5 mb-0">{{ 'workspace.title' | t }}</h1>
  </div>

  <div class="workspace-layout">
    <aside
      class="workspace-side-panel border-end pe-lg-3 d-none d-lg-block"
      data-testid="workspace-side-panel"
    >
      <h2 class="h6 mb-3">{{ 'workspace.sections' | t }}</h2>
      <ng-container [ngTemplateOutlet]="navigationTree" />
    </aside>

    <section class="workspace-content">
      <router-outlet />
    </section>
  </div>
  <ds-drawer [label]="'workspace.sections' | t" [closeLabel]="'shared.close' | t">
    @if (sidePanelOpen()) {
      <ng-container [ngTemplateOutlet]="navigationTree" />
    }
  </ds-drawer>

  <ng-template #navigationTree>
    <ds-foldable-tree
      [rootItems]="rootItems()"
      [sections]="sections()"
      [emptyMessage]="'workspace.emptySections' | t"
      [selectedItemKey]="selectedPageKey()"
      [defaultExpandedSectionKeys]="defaultExpandedSectionKeys()"
      sectionTestId="workspace-tree-section"
      itemTestId="workspace-tree-item"
      (itemSelected)="selectPage($event)"
    />
  </ng-template>
</main>
