<main class="container-fluid py-3 workspace-main">
  <ds-sidebar
    panelId="workspace-sections"
    [label]="'workspace.sections' | t"
    [openLabel]="'shared.navigation.expand' | t"
    [closeLabel]="'shared.navigation.collapse' | t"
    [open]="navigationOpen()"
    (openChange)="setNavigationOpen($event)"
  >
    <app-section-navigation
      dsSidebarNavigation
      id="workspace-navigation"
      [label]="'workspace.sections' | t"
      [home]="home"
      [groups]="visibleNavigationSections()"
      [selectedKey]="selectedPageKey()"
      (linkSelected)="onSectionSelected()"
    />
    <router-outlet />
  </ds-sidebar>
</main>
