<button
  #selectTrigger
  [id]="inputId()"
  type="button"
  [value]="formValue()"
  role="combobox"
  class="site-select-trigger"
  [class.site-select-trigger-small]="controlSize() === 'small'"
  [class.site-select-trigger-bordered]="appearance() === 'bordered'"
  [class.is-invalid]="invalid()"
  aria-haspopup="listbox"
  [attr.aria-controls]="listboxId()"
  [attr.aria-expanded]="open()"
  [attr.aria-activedescendant]="activeOptionId()"
  [attr.aria-required]="required() ? 'true' : null"
  [attr.aria-invalid]="invalid() ? 'true' : null"
  [attr.aria-describedby]="ariaDescribedBy()"
  [attr.data-testid]="testId()"
  [attr.popovertarget]="listboxId()"
  popovertargetaction="toggle"
  [disabled]="effectiveDisabled()"
  (click)="onTriggerClick()"
  (keydown)="onTriggerKeydown($event)"
  (keyup)="onTriggerKeyup($event)"
>
  <span class="site-select-value text-truncate">{{ displayLabel() }}</span>
  <svg
    class="site-select-chevron"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m6 9 6 6 6-6"></path>
  </svg>
</button>

<div
  #selectListbox
  [id]="listboxId()"
  popover="auto"
  role="listbox"
  class="site-select-listbox"
  [attr.data-testid]="listboxTestId()"
  (toggle)="onPopoverToggle($event)"
>
  @for (option of renderedOptions(); track option.id) {
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- DOM focus intentionally remains on the combobox per the select-only ARIA pattern. -->
    <div
      #selectOption
      [id]="option.id"
      role="option"
      class="site-select-option"
      [class.site-select-option-active]="option.active"
      [class.site-select-option-committed]="option.committed"
      [attr.aria-selected]="option.active ? 'true' : 'false'"
      [attr.data-index]="option.index"
      [attr.data-value]="option.value"
      (click)="chooseOption(option.index)"
    >
      <span>{{ option.label }}</span>
      @if (option.committed) {
        <svg
          class="site-select-check"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m5 12 4 4L19 6"></path>
        </svg>
      }
    </div>
  }
</div>
